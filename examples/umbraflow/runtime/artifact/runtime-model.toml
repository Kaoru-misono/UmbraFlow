schema_version = 2
base_resolution = [3, 1]
base_dpi = [96, 96]

[[ui_target]]
id = "fixture.marker"
kind = "region"

[[ui_target]]
id = "fixture.target"
kind = "control"

[[locator]]
id = "fixture.anchor"
kind = "template"
asset_path = "assets/fixture-anchor.png"
threshold = 1

[[locator]]
id = "fixture.mark"
kind = "template"
asset_path = "assets/fixture-mark.png"
threshold = 1

[[binding]]
id = "fixture.surface.anchor"
surface = "fixture.surface"
ui_target = "fixture.marker"
variant = "primary"
placement = { kind = "fixed", rect = [0, 0, 1, 1] }
detector = { all = [{ kind = "locator_present", locator = "fixture.anchor" }], any = [], none = [] }
actions = []

[[binding]]
id = "fixture.target.primary"
surface = "fixture.surface"
ui_target = "fixture.target"
variant = "primary"
placement = { kind = "fixed", rect = [1, 0, 1, 1], action_point = [1, 0] }
detector = { all = [{ kind = "locator_present", locator = "fixture.mark" }], any = [], none = [] }
actions = [{ id = "fixture.commit", kind = "key", key = "ENTER", proof_locator = "fixture.mark" }, { id = "fixture.press", kind = "click", proof_locator = "fixture.mark" }]

[[surface]]
id = "fixture.surface"
kind = "scene"
covers = []
identity = { all = ["fixture.surface.anchor"], any = [], none = [] }
